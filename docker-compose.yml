services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notesy
      POSTGRES_USER: notesy
      POSTGRES_PASSWORD: notesy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesy -d notesy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
        python manage.py seed &&
        gunicorn --bind 0.0.0.0:8000 notesy.wsgi:application"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://notesy:notesy@db:5432/notesy
      SUMMARIZER_API_KEY: ${SUMMARIZER_API_KEY}
      SUMMARIZER_URL: ${SUMMARIZER_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: