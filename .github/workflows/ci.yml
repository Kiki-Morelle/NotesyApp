
name: Notesy CI/CD

on:
  pull_request:
  push:
    branches:
      - main

env:
  DJANGO_SECRET_KEY: ci-only-not-secret
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgresql://notesy:notesy@localhost:5432/notesy

  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

  JFROG_REPO: devops-project

  AWS_REGION: us-east-1
  ECR_REPOSITORY: notesy

permissions:
  contents: read

jobs:

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run build


  test:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notesy
          POSTGRES_USER: notesy
          POSTGRES_PASSWORD: notesy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notesy -d notesy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run database migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest


  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - build
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    needs:
      - build
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t notesy-app:ci .


  publish-ecr:
    name: Build and Publish to ECR
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - build
      - test
      - sonarqube

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push image with commit SHA
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: publish-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition notesy \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update image
        run: |
          python - <<'PY'
          import json

          with open("task-definition.json") as f:
              task = json.load(f)

          image = (
              "977098999802.dkr.ecr.us-east-1.amazonaws.com/"
              "notesy:${{ github.sha }}"
          )

          task["containerDefinitions"][0]["image"] = image

          for field in [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy"
          ]:
              task.pop(field, None)

          with open("task-definition.json", "w") as f:
              json.dump(task, f)

          print(f"Deploying image: {image}")
          PY

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster notesy-cluster \
            --service notesy-service \
            --task-definition notesy \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster notesy-cluster \
            --services notesy-service \
            --region ${{ env.AWS_REGION }}

      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster notesy-cluster \
            --services notesy-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].{Desired:desiredCount,Running:runningCount,Status:status,TaskDefinition:taskDefinition}' \
            --output table


  publish-jfrog:
    name: Build and Publish TAR to JFrog
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - build
      - test
      - sonarqube

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t notesy:${{ github.sha }} \
            .

      - name: Export Docker image to TAR
        run: |
          docker save \
            -o notesy-${{ github.sha }}.tar \
            notesy:${{ github.sha }}

      - name: Upload TAR to JFrog
        run: |
          curl --fail --show-error --silent \
            -u "${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_ACCESS_TOKEN }}" \
            -T "notesy-${{ github.sha }}.tar" \
            "${{ secrets.JFROG_URL }}/artifactory/${{ env.JFROG_REPO }}/notesy-${{ github.sha }}.tar"

